{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Welcome back</h1><p class="muted">Sign in to scan leaves and see your history.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus value="{{ email }}"></div>
    <div class="field"><label for="password">Password</label>
      <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="pw-toggle" type="button" aria-pressed="false">Show</button></div></div>
    <div class="row spread field"><label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label><a class="small" href="{{ url_for('auth.forgot') }}">Forgot password?</a></div>
    <button class="btn block" type="submit">Sign in</button>
  </form>
  <p class="small muted">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</div>
{% endblock %}
