{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Forgot your password?</h1><p class="muted">Enter your account email and we'll send a 6-digit code that expires in {{ config.OTP_MINUTES }} minutes.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autofocus autocomplete="email"></div>
    <button class="btn block" type="submit">Send code</button></form>
  <p class="small muted"><a href="{{ url_for('auth.login') }}">← Back to sign in</a></p>
</div>
{% endblock %}
