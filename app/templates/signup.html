{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Create your account</h1><p class="muted">Save scans, track disease over the season, and get tailored advice.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="60" value="{{ form.name }}"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ form.email }}"></div>
    <div class="field"><label for="password">Password</label>
      <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" data-pw-check><button class="pw-toggle" type="button" aria-pressed="false">Show</button></div>
      {% include "_pw_rules.html" %}</div>
    <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required data-pw-confirm></div>
    <button class="btn block" type="submit">Create account</button>
  </form>
  <p class="small muted">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
